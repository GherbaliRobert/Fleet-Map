# RA Tracks pe Fly.io
#   fly launch --no-deploy        (creează app-ul, alege regiunea)
#   fly volumes create gpsdata --size 1
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32) ADMIN_PASSWORD=parola-ta
#   fly deploy
app = "ra-track"
primary_region = "fra"   # Frankfurt (latență bună pentru România)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TCP_PORT = "5027"
  COOKIE_SECURE = "true"

[mounts]
  source = "gpsdata"
  destination = "/app/data"

# Web/API (HTTPS automat pe https://<app>.fly.dev)
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# TCP brut pentru dispozitivele Teltonika (port public 5027)
[[services]]
  protocol = "tcp"
  internal_port = 5027
  [[services.ports]]
    port = 5027
