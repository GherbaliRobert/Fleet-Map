<!DOCTYPE html>
<html lang="ro">
<head>
  <!-- Analytics (GA4) se încarcă DOAR după consimțământ explicit — vezi public/js/consent.js. -->
  <script src="/js/consent.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setează parola · RA Track</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- „Ochiul” și sfaturile pentru o parolă puternică: aceeași regulă ca intrarea în aplicație și „Contul meu” (js/parola.js). -->
  <script src="/js/parola.js"></script>
  <style>
    :root{--bg:#0B0E11;--bg2:#11161B;--text:#E6EAF0;--muted:#9AA6B2;--accent:#3FE07D;--border:#1F2730;--red:#F87171;--amber:#FBBF24}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Nunito',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}.brand img{height:26px}.brand b{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1}
    h1{font-size:18px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px;margin:0 0 18px}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
    .camp-parola{position:relative}
    input{width:100%;padding:11px 46px 11px 13px;border-radius:9px;border:1px solid var(--border);background:#0E1318;color:var(--text);font:inherit;font-size:15px}
    input:focus{outline:none;border-color:var(--accent)}
    input::-ms-reveal,input::-ms-clear{display:none}  /* Edge își pune ochiul lui: ar fi două */
    /* „Ochiul”: arată sau ascunde ce scrii (Alin, 19.11). Amândouă casetele deodată. */
    .ochi{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;margin:0;padding:0;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .ochi:hover,.ochi:focus-visible{color:var(--text);background:#1A2128;outline:none}
    .ochi svg{width:20px;height:20px}
    .ochi .o-inchis{display:none}.ochi.vizibil .o-deschis{display:none}.ochi.vizibil .o-inchis{display:block}
    /* Cât de puternică e parola + sfaturile, bifate pe loc (js/parola.js) */
    .pf-forta{margin-top:10px;display:flex;align-items:center;gap:10px}
    .pf-bara{flex:1;height:6px;border-radius:99px;background:#1F2730;overflow:hidden}
    .pf-bara i{display:block;height:100%;width:0;border-radius:99px;background:var(--red);transition:width .2s,background .2s}
    .pf-text{font-size:12px;font-weight:700;color:var(--muted);min-width:66px;text-align:right}
    .pf-slaba .pf-text{color:var(--red)}.pf-slaba .pf-bara i{background:var(--red)}
    .pf-acceptabila .pf-text{color:var(--amber)}.pf-acceptabila .pf-bara i{background:var(--amber)}
    .pf-buna .pf-text,.pf-puternica .pf-text{color:var(--accent)}.pf-buna .pf-bara i,.pf-puternica .pf-bara i{background:var(--accent)}
    .pf-sfaturi{margin:10px 0 0;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#0E1318}
    .pf-titlu{font-size:12px;font-weight:700;color:var(--text);margin:0 0 6px}
    .pf-sfaturi ul{list-style:none;margin:0;padding:0;font-size:13px}
    .pf-sfaturi li{display:flex;align-items:center;gap:8px;color:var(--muted);line-height:1.9}
    .pf-sfaturi li b{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid #3A4552;font-size:10px;line-height:1;flex:0 0 16px}
    .pf-sfaturi li.da{color:var(--text)}.pf-sfaturi li.da b{background:var(--accent);border-color:var(--accent);color:#06210F}
    .pf-sfaturi li small{color:var(--muted);font-size:11px}
    .pf-exemplu{font-size:12px;color:var(--muted);margin:8px 0 0}
    .potrivire{font-size:12px;margin-top:6px;min-height:18px}.potrivire.pf-ok{color:var(--accent)}.potrivire.pf-nu{color:var(--amber)}
    button.trimite{width:100%;margin-top:18px;padding:12px;border:none;border-radius:9px;background:var(--accent);color:#06210F;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
    button.trimite:disabled{opacity:.6;cursor:default}
    .msg{margin-top:14px;font-size:13px;min-height:18px}.err{color:var(--red)}.ok{color:var(--accent)}.galben{color:var(--amber)}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/logo-mark.png" alt="RA"><b>Track</b></div>
    <h1>Setează-ți parola</h1>
    <p class="muted">Alege o parolă pentru contul tău: minim 10 caractere, de cel puțin două feluri (de exemplu litere și cifre).</p>
    <form id="f" autocomplete="off">
      <label for="p1">Parolă nouă (minim 10 caractere)</label>
      <div class="camp-parola" data-ochi-grup="nou">
        <input id="p1" type="password" minlength="10" required autocomplete="new-password" aria-describedby="sfaturi">
        <button type="button" class="ochi" aria-label="Arată parola" title="Arată parola" aria-pressed="false">
          <svg class="o-deschis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="o-inchis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a19.6 19.6 0 0 1 5.1-5.9M9.9 5.2A9.8 9.8 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-2.3 3.4M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <div class="pf" id="sfaturi"></div>
      <label for="p2">Confirmă parola</label>
      <div class="camp-parola" data-ochi-grup="nou">
        <input id="p2" type="password" minlength="10" required autocomplete="new-password">
        <button type="button" class="ochi" aria-label="Arată parola" title="Arată parola" aria-pressed="false">
          <svg class="o-deschis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="o-inchis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a19.6 19.6 0 0 1 5.1-5.9M9.9 5.2A9.8 9.8 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-2.3 3.4M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <div class="potrivire" id="potrivire" aria-live="polite"></div>
      <button id="b" class="trimite" type="submit">Salvează parola</button>
      <div class="msg" id="m"></div>
    </form>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get('token') || '';
    var f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
    var i1 = document.getElementById('p1'), i2 = document.getElementById('p2');
    if (!token) { m.className = 'msg err'; m.textContent = 'Link invalid (lipsește tokenul).'; b.disabled = true; }

    // Ochiul (amândouă casetele deodată — `data-ochi-grup`), bara de tărie și sfaturile, bifate pe loc: js/parola.js. Obligatoriu
    // (ca serverul): 10 caractere și cel puțin două feluri; restul face parola puternică. Serverul mai refuză parolele foarte
    // cunoscute și pe cele care conțin numele de utilizator — le spune el, la salvare.
    var sf = document.getElementById('sfaturi'), pot = document.getElementById('potrivire');
    RaParola.umple(sf);
    i1.addEventListener('input', function () { RaParola.arata(sf, i1.value); RaParola.aratPotrivire(pot, i1.value, i2.value); });
    i2.addEventListener('input', function () { RaParola.aratPotrivire(pot, i1.value, i2.value); });

    f.addEventListener('submit', async function (e) {
      e.preventDefault();
      var p1 = i1.value, p2 = i2.value;
      m.className = 'msg';
      if (p1 !== p2) { m.className = 'msg err'; m.textContent = 'Parolele nu coincid.'; return; }
      // Aceeași cifră ca serverul (PAROLA_MIN în server.js) — legate printr-o probă. Restul regulilor le spune serverul.
      if (p1.length < 10) { m.className = 'msg err'; m.textContent = 'Minim 10 caractere.'; return; }
      b.disabled = true; b.textContent = 'Se salvează…';
      try {
        var r = await fetch('/api/auth/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: p1 }) });
        var j = await r.json();
        if (!r.ok || j.error) { m.className = 'msg err'; m.textContent = j.error || 'Eroare.'; b.disabled = false; b.textContent = 'Salvează parola'; return; }
        RaParola.ascunde(f);
        m.className = 'msg ok'; m.textContent = 'Parolă setată ✓ Te redirecționăm către aplicație…';
        setTimeout(function () { location.href = '/app'; }, 1500);
      } catch (err) { m.className = 'msg err'; m.textContent = 'Eroare: ' + err.message; b.disabled = false; b.textContent = 'Salvează parola'; }
    });
  </script>
</body>
</html>
