<!DOCTYPE html>
<html lang="ro">
<head>
  <!-- Analytics (GA4) se încarcă DOAR după consimțământ explicit — vezi public/js/consent.js. -->
  <script src="/js/consent.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setează parola · RA Tracks</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0B0E11;--bg2:#11161B;--text:#E6EAF0;--muted:#9AA6B2;--accent:#3FE07D;--border:#1F2730;--red:#F87171}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Nunito',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
    .brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}.brand img{height:26px}.brand b{font-size:19px}
    h1{font-size:18px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px;margin:0 0 18px}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
    input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);background:#0E1318;color:var(--text);font-size:15px}
    input:focus{outline:none;border-color:var(--accent)}
    button{width:100%;margin-top:18px;padding:12px;border:none;border-radius:9px;background:var(--accent);color:#06210F;font-weight:700;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    .msg{margin-top:14px;font-size:13px;min-height:18px}.err{color:var(--red)}.ok{color:var(--accent)}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/logo-mark.png" alt="RA"><b>RA Tracks</b></div>
    <h1>Setează-ți parola</h1>
    <p class="muted">Alege o parolă pentru contul tău.</p>
    <form id="f" autocomplete="off">
      <label for="p1">Parolă nouă (min 6 caractere)</label>
      <input id="p1" type="password" minlength="6" required>
      <label for="p2">Confirmă parola</label>
      <input id="p2" type="password" minlength="6" required>
      <button id="b" type="submit">Salvează parola</button>
      <div class="msg" id="m"></div>
    </form>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get('token') || '';
    var f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
    if (!token) { m.className = 'msg err'; m.textContent = 'Link invalid (lipsește tokenul).'; b.disabled = true; }
    f.addEventListener('submit', async function (e) {
      e.preventDefault();
      var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
      m.className = 'msg';
      if (p1 !== p2) { m.className = 'msg err'; m.textContent = 'Parolele nu coincid.'; return; }
      if (p1.length < 6) { m.className = 'msg err'; m.textContent = 'Minim 6 caractere.'; return; }
      b.disabled = true; b.textContent = 'Se salvează…';
      try {
        var r = await fetch('/api/auth/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: p1 }) });
        var j = await r.json();
        if (!r.ok || j.error) { m.className = 'msg err'; m.textContent = j.error || 'Eroare.'; b.disabled = false; b.textContent = 'Salvează parola'; return; }
        m.className = 'msg ok'; m.textContent = 'Parolă setată ✓ Te redirecționăm către aplicație…';
        setTimeout(function () { location.href = '/app'; }, 1500);
      } catch (err) { m.className = 'msg err'; m.textContent = 'Eroare: ' + err.message; b.disabled = false; b.textContent = 'Salvează parola'; }
    });
  </script>
</body>
</html>
