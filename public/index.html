<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }

    /* ─── Login ─── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
    }

    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 360px;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 22px;
    }

    .login-box p {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus { border-color: #38bdf8; }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 12px;
    }

    .btn-primary:hover { background: #1d4ed8; }

    .login-error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }

    /* ─── App ─── */
    #app { display: none; height: 100vh; }
    #app.visible { display: flex; }
    #login-screen.hidden { display: none; }

    /* Sidebar */
    #sidebar {
      width: 340px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    #sidebar-header h1 {
      font-size: 18px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-actions { display: flex; gap: 6px; }

    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      font-size: 11px;
    }

    .btn-sm:hover { border-color: #38bdf8; color: #e2e8f0; }

    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover { background: #ef4444; color: white; }

    #stats {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .stat {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      flex: 1;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-label { color: #94a3b8; }

    #device-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .device-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .device-card:hover { border-color: #38bdf8; transform: translateX(2px); }
    .device-card.active { border-color: #38bdf8; background: #1e3a5f; }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .device-name { font-weight: 600; font-size: 14px; }
    .device-imei { font-size: 11px; color: #64748b; font-family: monospace; }

    .device-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-offline { background: #64748b; }

    .device-info {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #94a3b8;
    }

    .device-info span { display: flex; align-items: center; gap: 3px; }

    /* Map */
    #map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* History panel */
    #history-panel {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      z-index: 1000;
    }

    #history-panel.visible { display: block; }

    #history-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    #history-controls input, #history-controls button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }

    #history-controls button {
      background: #2563eb;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    #history-controls button:hover { background: #1d4ed8; }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    /* Connection status */
    #ws-status {
      padding: 6px 16px;
      font-size: 11px;
      text-align: center;
      border-top: 1px solid #334155;
    }

    .ws-connected { color: #22c55e; }
    .ws-disconnected { color: #ef4444; }

    /* ─── Modal Utilizatori ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 420px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .user-row .role {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #334155;
      color: #94a3b8;
    }

    .user-row .role.admin { background: #7c3aed22; color: #a78bfa; }

    .add-user-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .add-user-form input, .add-user-form select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      flex: 1;
      min-width: 100px;
    }

    .add-user-form button {
      padding: 8px 16px;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- ═══ Login Screen ═══ -->
  <div id="login-screen">
    <div class="login-box">
      <h1>GPS Tracker</h1>
      <p>Autentificare necesara</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Parola</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Autentificare</button>
      </form>
    </div>
  </div>

  <!-- ═══ App (hidden until login) ═══ -->
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>
          <span>GPS Tracker</span>
          <div class="header-actions">
            <a href="/debug.html" class="btn-sm" id="btn-debug" style="display:none;text-decoration:none;">Debug</a>
            <button class="btn-sm" id="btn-users" style="display:none" onclick="openUsersModal()">Utilizatori</button>
            <button class="btn-sm btn-danger" onclick="logout()">Iesire</button>
          </div>
        </h1>
        <div id="stats">
          <div class="stat">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Dispozitive</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-online">0</div>
            <div class="stat-label">Online</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-moving">0</div>
            <div class="stat-label">In miscare</div>
          </div>
        </div>
      </div>
      <div id="device-list"></div>
      <div id="ws-status" class="ws-disconnected">Conectare...</div>
    </div>

    <div id="map-container">
      <div id="map"></div>
      <div id="history-panel">
        <button class="close-btn" onclick="closeHistory()">&#10005;</button>
        <h3 style="margin-bottom: 10px; font-size: 14px;">Istoric traseu</h3>
        <div id="history-controls">
          <label style="font-size: 12px;">De la:</label>
          <input type="datetime-local" id="history-from">
          <label style="font-size: 12px;">Pana la:</label>
          <input type="datetime-local" id="history-to">
          <button onclick="loadHistory()">Incarca</button>
          <button onclick="exportCSV()" style="background:#22c55e;">Export CSV</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Modal Editare Dispozitiv ═══ -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal">
      <h2>
        Editare dispozitiv
        <button class="close-btn" onclick="closeEditModal()" style="position:static;font-size:18px;">&#10005;</button>
      </h2>
      <div class="form-group">
        <label>IMEI</label>
        <input type="text" id="edit-imei" disabled style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#64748b;font-size:14px;font-family:monospace;">
      </div>
      <div class="form-group">
        <label>Nume</label>
        <input type="text" id="edit-name" placeholder="ex: Dacia Logan #1" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;">
      </div>
      <div class="form-group">
        <label>Tip vehicul</label>
        <select id="edit-vehicle-type" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;">
          <option value="">-- Selecteaza --</option>
          <option value="Auto">Auto</option>
          <option value="Camion">Camion</option>
          <option value="Duba">Duba</option>
          <option value="Motocicleta">Motocicleta</option>
          <option value="Utilaj">Utilaj</option>
          <option value="Altul">Altul</option>
        </select>
      </div>
      <div class="form-group">
        <label>Numar inmatriculare</label>
        <input type="text" id="edit-plate" placeholder="ex: B 123 ABC" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;text-transform:uppercase;">
      </div>
      <button class="btn btn-primary" onclick="saveDevice()" style="margin-top:8px;">Salveaza</button>
    </div>
  </div>

  <!-- ═══ Modal Utilizatori ═══ -->
  <div id="users-modal" class="modal-overlay">
    <div class="modal">
      <h2>
        Utilizatori
        <button class="close-btn" onclick="closeUsersModal()" style="position:static;font-size:18px;">&#10005;</button>
      </h2>
      <div id="users-list"></div>
      <div class="add-user-form">
        <input type="text" id="new-username" placeholder="Username">
        <input type="password" id="new-password" placeholder="Parola">
        <select id="new-role">
          <option value="viewer">Viewer</option>
          <option value="admin">Admin</option>
        </select>
        <button onclick="addUser()">Adauga</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── Stare globală ───
    let currentUser = null;
    let mapInitialized = false;
    let map, markers, devices, selectedImei, historyLine;

    // ─── Auth ───
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
          return;
        }

        currentUser = data;
        showApp();
      } catch (err) {
        errorEl.textContent = 'Eroare de conexiune';
        errorEl.style.display = 'block';
      }
    });

    // Verifică dacă e deja autentificat
    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          currentUser = await res.json();
          showApp();
        }
      } catch (err) {
        // nu e logat
      }
    }

    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');

      if (currentUser.role === 'admin') {
        document.getElementById('btn-users').style.display = '';
        document.getElementById('btn-debug').style.display = '';
      }

      if (!mapInitialized) {
        initMap();
        mapInitialized = true;
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    }

    // ─── Utilizatori (admin) ───
    async function openUsersModal() {
      document.getElementById('users-modal').classList.add('visible');
      await loadUsers();
    }

    function closeUsersModal() {
      document.getElementById('users-modal').classList.remove('visible');
    }

    async function loadUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const list = document.getElementById('users-list');

      list.innerHTML = users.map(u => `
        <div class="user-row">
          <div>
            <strong>${u.username}</strong>
            <span class="role ${u.role}">${u.role}</span>
          </div>
          ${u.username !== currentUser.username
            ? `<button class="btn-sm btn-danger" onclick="deleteUser(${u.id})">Sterge</button>`
            : '<span style="font-size:11px;color:#64748b">tu</span>'
          }
        </div>
      `).join('');
    }

    async function addUser() {
      const username = document.getElementById('new-username').value;
      const password = document.getElementById('new-password').value;
      const role = document.getElementById('new-role').value;

      if (!username || !password) return alert('Completeaza toate campurile');

      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role })
      });

      if (!res.ok) {
        const err = await res.json();
        return alert(err.error);
      }

      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
      await loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm('Sigur vrei sa stergi acest utilizator?')) return;
      await fetch(`/api/users/${id}`, { method: 'DELETE' });
      await loadUsers();
    }

    // ─── Hartă ───
    function initMap() {
      map = L.map('map').setView([44.4268, 26.1025], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markers = new Map();
      devices = new Map();
      selectedImei = null;
      historyLine = null;

      connectWs();

      // Fallback: încarcă dispozitivele prin HTTP dacă WS nu merge
      fetch('/api/live').then(r => r.json()).then(data => {
        data.forEach(updateMarker);
      }).catch(() => {});
    }

    // ─── Iconițe ───
    function createIcon(angle, speed, isSelected) {
      const color = speed > 0 ? '#22c55e' : '#64748b';
      const size = isSelected ? 14 : 10;
      const border = isSelected ? '3px solid #38bdf8' : '2px solid #fff';
      return L.divIcon({
        className: 'vehicle-marker',
        html: `<div style="
          width: ${size}px; height: ${size}px;
          background: ${color};
          border: ${border};
          border-radius: 50%;
          box-shadow: 0 0 8px ${color};
        "></div>`,
        iconSize: [size + 6, size + 6],
        iconAnchor: [(size + 6) / 2, (size + 6) / 2]
      });
    }

    // ─── Actualizare marker pe hartă ───
    function updateMarker(data) {
      const { imei, latitude, longitude, speed, angle, timestamp, io } = data;

      devices.set(imei, data);

      const isSelected = imei === selectedImei;
      const icon = createIcon(angle, speed, isSelected);

      const name = data.name || imei;
      const ignition = io?.ignition ? 'ON' : 'OFF';
      const popupContent = `
        <div style="font-family: sans-serif; font-size: 13px; min-width: 180px;">
          <b>${name}</b><br>
          <span style="color: #666; font-size: 11px;">${imei}</span><br><br>
          Viteza: <b>${speed} km/h</b><br>
          Contact: ${ignition}<br>
          Sateliti: ${data.satellites || '-'}<br>
          ${new Date(timestamp).toLocaleString('ro-RO')}<br>
          <br>
          <a href="#" onclick="showHistory('${imei}'); return false;" style="color: #2563eb;">Vezi istoric</a> |
          <a href="#" onclick="openEditModal('${imei}'); return false;" style="color: #f97316;">Editeaza</a>
        </div>
      `;

      if (markers.has(imei)) {
        const marker = markers.get(imei);
        marker.setLatLng([latitude, longitude]);
        marker.setIcon(icon);
        marker.getPopup().setContent(popupContent);
      } else {
        const marker = L.marker([latitude, longitude], { icon })
          .bindPopup(popupContent)
          .addTo(map);

        marker.on('click', () => selectDevice(imei));
        markers.set(imei, marker);
      }

      if (isSelected) {
        map.panTo([latitude, longitude]);
      }

      updateDeviceList();
    }

    // ─── Lista dispozitivelor din sidebar ───
    function updateDeviceList() {
      const list = document.getElementById('device-list');
      const devicesArray = Array.from(devices.values());

      document.getElementById('stat-total').textContent = devicesArray.length;
      document.getElementById('stat-online').textContent = devicesArray.length;
      document.getElementById('stat-moving').textContent = devicesArray.filter(d => d.speed > 0).length;

      list.innerHTML = devicesArray.map(d => {
        const isActive = d.imei === selectedImei;
        const isMoving = d.speed > 0;
        const name = d.name || d.imei;
        const timeAgo = getTimeAgo(new Date(d.timestamp));
        const ignition = d.io?.ignition ? 'Contact ON' : 'Contact OFF';

        return `
          <div class="device-card ${isActive ? 'active' : ''}" onclick="selectDevice('${d.imei}')">
            <div class="device-header">
              <div>
                <span class="device-status ${isMoving ? 'status-online' : 'status-offline'}"></span>
                <span class="device-name">${name}</span>
              </div>
              <span style="font-size: 12px; color: ${isMoving ? '#22c55e' : '#94a3b8'}">
                ${d.speed} km/h
              </span>
            </div>
            <div class="device-imei">${d.imei}</div>
            <div class="device-info">
              <span>Contact: ${ignition}</span>
              <span>${timeAgo}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectDevice(imei) {
      selectedImei = imei;
      const data = devices.get(imei);
      if (data) {
        map.flyTo([data.latitude, data.longitude], 16);
        markers.get(imei)?.openPopup();
      }
      devices.forEach((d, key) => {
        const marker = markers.get(key);
        if (marker) {
          marker.setIcon(createIcon(d.angle, d.speed, key === selectedImei));
        }
      });
      updateDeviceList();
    }

    // ─── Istoric traseu ───
    function showHistory(imei) {
      selectedImei = imei;
      const panel = document.getElementById('history-panel');
      panel.classList.add('visible');

      const now = new Date();
      const yesterday = new Date(now - 24 * 60 * 60 * 1000);

      document.getElementById('history-from').value = formatDateLocal(yesterday);
      document.getElementById('history-to').value = formatDateLocal(now);
    }

    function closeHistory() {
      document.getElementById('history-panel').classList.remove('visible');
      if (historyLine) {
        map.removeLayer(historyLine);
        historyLine = null;
      }
    }

    async function loadHistory() {
      if (!selectedImei) return;

      const from = document.getElementById('history-from').value;
      const to = document.getElementById('history-to').value;
      if (!from || !to) return;

      try {
        const res = await fetch(`/api/history/${selectedImei}?from=${new Date(from).toISOString()}&to=${new Date(to).toISOString()}`);
        const data = await res.json();

        if (historyLine) map.removeLayer(historyLine);

        if (data.length === 0) {
          alert('Nu sunt date pentru perioada selectata');
          return;
        }

        const points = data.map(p => [p.latitude, p.longitude]);
        historyLine = L.polyline(points, {
          color: '#2563eb',
          weight: 3,
          opacity: 0.8
        }).addTo(map);

        map.fitBounds(historyLine.getBounds(), { padding: [50, 50] });

        L.circleMarker(points[0], { radius: 6, color: '#22c55e', fillOpacity: 1 })
          .bindPopup(`Start: ${new Date(data[0].timestamp).toLocaleString('ro-RO')}`)
          .addTo(map);
        L.circleMarker(points[points.length - 1], { radius: 6, color: '#ef4444', fillOpacity: 1 })
          .bindPopup(`Stop: ${new Date(data[data.length - 1].timestamp).toLocaleString('ro-RO')}`)
          .addTo(map);

      } catch (err) {
        console.error('Eroare incarcare istoric:', err);
      }
    }

    // ─── WebSocket — date live ───
    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);
      const statusEl = document.getElementById('ws-status');

      ws.onopen = () => {
        statusEl.textContent = 'Conectat — date live';
        statusEl.className = 'ws-connected';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'init') {
          msg.data.forEach(updateMarker);
          if (msg.data.length > 0) {
            const bounds = msg.data.map(d => [d.latitude, d.longitude]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
          }
        }

        if (msg.type === 'position') {
          updateMarker(msg.data);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Deconectat — reconectare...';
        statusEl.className = 'ws-disconnected';
        setTimeout(connectWs, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // ─── Utilități ───
    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return 'acum';
      if (seconds < 3600) return `${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} ore`;
      return `${Math.floor(seconds / 86400)} zile`;
    }

    function formatDateLocal(date) {
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    // ─── Editare dispozitiv ───
    function openEditModal(imei) {
      document.getElementById('edit-modal').classList.add('visible');
      document.getElementById('edit-imei').value = imei;

      // Fetch device info from DB
      fetch('/api/devices').then(r => r.json()).then(devs => {
        const dev = devs.find(d => d.imei === imei);
        if (dev) {
          document.getElementById('edit-name').value = dev.name || '';
          document.getElementById('edit-vehicle-type').value = dev.vehicle_type || '';
          document.getElementById('edit-plate').value = dev.plate || '';
        }
      });
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('visible');
    }

    async function saveDevice() {
      const imei = document.getElementById('edit-imei').value;
      const name = document.getElementById('edit-name').value;
      const vehicle_type = document.getElementById('edit-vehicle-type').value;
      const plate = document.getElementById('edit-plate').value.toUpperCase();

      const res = await fetch(`/api/devices/${imei}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, vehicle_type, plate })
      });

      if (res.ok) {
        closeEditModal();
        // Update local device data
        const dev = devices.get(imei);
        if (dev) {
          dev.name = name;
          dev.vehicle_type = vehicle_type;
          dev.plate = plate;
          updateMarker(dev);
        }
      } else {
        alert('Eroare la salvare');
      }
    }

    // ─── Export CSV ───
    async function exportCSV() {
      if (!selectedImei) return alert('Selecteaza un dispozitiv');

      const from = document.getElementById('history-from').value;
      const to = document.getElementById('history-to').value;
      if (!from || !to) return alert('Selecteaza perioada');

      const url = `/api/export/${selectedImei}?from=${new Date(from).toISOString()}&to=${new Date(to).toISOString()}`;
      window.open(url, '_blank');
    }

    // ─── Pornire ───
    checkAuth();
  </script>
