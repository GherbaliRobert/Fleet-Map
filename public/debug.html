<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Tracker — Debug Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Consolas', 'Monaco', monospace; background: #0f172a; color: #e2e8f0; }

    #app { display: flex; height: 100vh; }

    /* Sidebar */
    #sidebar {
      width: 300px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    #sidebar-header h1 {
      font-size: 16px;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      font-size: 11px;
      text-decoration: none;
    }

    .btn-sm:hover { border-color: #38bdf8; color: #e2e8f0; }

    #controls {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #controls input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      font-family: inherit;
    }

    #controls button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-blue { background: #2563eb; color: white; }

    /* Device list */
    #device-selector {
      padding: 8px;
      border-bottom: 1px solid #334155;
    }

    #device-selector h3 {
      font-size: 11px;
      color: #94a3b8;
      padding: 4px 8px;
      text-transform: uppercase;
    }

    .device-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      text-align: left;
      margin-bottom: 4px;
    }

    .device-btn:hover { border-color: #38bdf8; }
    .device-btn.active { border-color: #38bdf8; background: #1e3a5f; }

    /* Stats */
    #stats-panel {
      padding: 12px 16px;
      font-size: 11px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }

    #stats-panel div { margin-bottom: 4px; }
    #stats-panel span { color: #38bdf8; font-weight: 700; }

    /* IO Live Values */
    #io-live {
      max-height: 40%;
      overflow-y: auto;
      padding: 8px;
      border-bottom: 1px solid #334155;
    }

    #io-live h3 {
      font-size: 11px;
      color: #22c55e;
      padding: 4px 8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .io-live-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 8px;
      font-size: 11px;
      border-bottom: 1px solid #1e293b;
    }

    .io-live-row.updated {
      background: #1e3a5f;
      transition: background 0.3s;
    }

    .io-cat-header {
      color: #a78bfa;
      font-weight: bold;
      padding: 6px 8px 2px;
      font-size: 11px;
    }

    .io-live-name { color: #94a3b8; }
    .io-live-val { color: #38bdf8; font-weight: 600; }

    /* IO Reference */
    #io-ref {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    #io-ref h3 {
      font-size: 11px;
      color: #94a3b8;
      padding: 4px 8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .io-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 8px;
      font-size: 11px;
      border-bottom: 1px solid #1e293b;
    }

    .io-id { color: #64748b; }
    .io-name { color: #94a3b8; }

    /* Main area */
    #main { flex: 1; display: flex; flex-direction: column; }

    /* Live log */
    #log-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #log-header {
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #log-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 12px;
    }

    .log-entry {
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .log-entry:hover { background: #1e293b; }
    .log-entry.selected { background: #1e293b; border-left-color: #38bdf8; }

    .log-time { color: #64748b; margin-right: 8px; }
    .log-event { font-weight: 600; margin-right: 8px; }

    .event-connect { color: #22c55e; }
    .event-imei { color: #38bdf8; }
    .event-data { color: #a78bfa; }
    .event-disconnect { color: #f97316; }
    .event-error { color: #ef4444; }

    .log-detail { color: #94a3b8; }

    /* Detail panel */
    #detail-panel {
      height: 45%;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    #detail-header {
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #94a3b8;
    }

    /* JSON syntax highlighting */
    .json-key { color: #38bdf8; }
    .json-string { color: #22c55e; }
    .json-number { color: #f97316; }
    .json-bool { color: #a78bfa; }
    .json-null { color: #64748b; }

    /* WS status */
    #ws-bar {
      padding: 4px 16px;
      font-size: 11px;
      text-align: center;
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    .ws-ok { color: #22c55e; }
    .ws-err { color: #ef4444; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>
          Debug Console
          <a href="/" class="btn-sm">Harta</a>
        </h1>
      </div>

      <div id="controls">
        <input type="text" id="filter-imei" placeholder="Filtru IMEI...">
        <button class="btn-green" id="btn-pause">Live</button>
        <button class="btn-blue" onclick="clearLog()">Clear</button>
      </div>

      <div id="stats-panel">
        <div>Intrari log: <span id="log-count">0</span></div>
        <div>Dispozitive active: <span id="active-count">0</span></div>
        <div>Conexiuni TCP: <span id="tcp-count">0</span></div>
      </div>

      <div id="device-selector">
        <h3>Dispozitive</h3>
        <div id="device-list"></div>
      </div>

      <div id="io-live">
        <h3>Live IO Values</h3>
        <div id="io-live-content" style="font-size:11px;color:#64748b;padding:4px 8px;">Selecteaza un dispozitiv pentru a vedea IO live.</div>
      </div>

      <div id="io-ref">
        <h3>IO Elements Reference</h3>
        <div id="io-table"></div>
      </div>
    </div>

    <!-- Main -->
    <div id="main">
      <div id="log-panel">
        <div id="log-header">
          Live TCP Log
          <span id="log-status" style="font-size:11px;color:#64748b;">0 intrari</span>
        </div>
        <div id="log-container"></div>
      </div>

      <div id="detail-panel">
        <div id="detail-header">
          Date detaliate
          <button class="btn-sm" onclick="copyDetail()">Copiaza JSON</button>
        </div>
        <div id="detail-content">Click pe o intrare din log pentru a vedea detaliile complete.</div>
      </div>
    </div>
  </div>

  <div id="ws-bar" class="ws-err">Conectare...</div>

  <script>
    // ─── Auth check ───
    fetch('/api/me').then(r => {
      if (!r.ok) window.location.href = '/';
      return r.json();
    }).then(user => {
      if (user.role !== 'admin') window.location.href = '/';
    }).catch(() => window.location.href = '/');

    // ─── State ───
    const logEntries = [];
    let isPaused = false;
    let selectedEntry = null;
    let filterImei = '';
    const knownDevices = new Set();

    // ─── IO Reference table ───
    const ioNames = {
      1: 'digital_input_1', 2: 'digital_input_2', 3: 'digital_input_3',
      6: 'analog_input_2', 9: 'analog_input_1', 10: 'sd_status', 11: 'iccid',
      16: 'total_odometer', 21: 'gsm_signal', 24: 'speed_io',
      29: 'can_fuel_level', 30: 'can_fuel_consumed', 31: 'can_fuel_rate',
      32: 'can_speed', 33: 'can_rpm', 35: 'can_coolant_temp',
      36: 'can_pedal_position', 37: 'can_engine_hours', 38: 'can_total_mileage',
      66: 'external_voltage', 67: 'battery_voltage', 68: 'battery_current',
      69: 'gnss_status', 80: 'data_mode', 83: 'fuel_used_gps',
      84: 'fuel_rate_gps', 87: 'total_mileage', 110: 'fuel_consumed',
      113: 'battery_level', 175: 'auto_geofence',
      179: 'digital_output_1', 180: 'digital_output_2',
      181: 'gnss_pdop', 182: 'gnss_hdop',
      200: 'sleep_mode', 239: 'ignition', 240: 'movement',
      241: 'active_gsm_operator', 246: 'towing', 247: 'crash_detection',
      250: 'trip', 251: 'idling', 252: 'unplug',
      253: 'green_driving_type', 254: 'green_driving_value', 255: 'over_speeding'
    };

    const ioTable = document.getElementById('io-table');
    ioTable.innerHTML = Object.entries(ioNames)
      .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
      .map(([id, name]) => `<div class="io-row"><span class="io-id">ID ${id}</span><span class="io-name">${name}</span></div>`)
      .join('');

    // ─── Pause button ───
    document.getElementById('btn-pause').addEventListener('click', function() {
      isPaused = !isPaused;
      this.textContent = isPaused ? 'Paused' : 'Live';
      this.className = isPaused ? 'btn-red' : 'btn-green';
    });

    // ─── Filter ───
    document.getElementById('filter-imei').addEventListener('input', function() {
      filterImei = this.value.trim();
      renderLog();
    });

    // ─── Log rendering ───
    function addLogEntry(entry) {
      logEntries.push(entry);
      if (logEntries.length > 500) logEntries.shift();

      if (entry.imei) knownDevices.add(entry.imei);
      updateDeviceList();
      updateStats();

      // Actualizeaza live IO cand primim date
      if (entry.event === 'data' && entry.records) {
        updateLiveIo(entry.imei, entry.records);
      }

      if (!isPaused) renderLog();
    }

    function renderLog() {
      const container = document.getElementById('log-container');
      const filtered = filterImei
        ? logEntries.filter(e => e.imei && e.imei.includes(filterImei))
        : logEntries;

      container.innerHTML = filtered.map((entry, idx) => {
        const time = new Date(entry.time).toLocaleTimeString('ro-RO', { hour12: false, fractionalSecondDigits: 1 });
        const eventClass = `event-${entry.event}`;
        let detail = '';

        switch (entry.event) {
          case 'connect':
            detail = `Conexiune noua de la ${entry.address}`;
            break;
          case 'imei':
            detail = `IMEI: ${entry.imei} (${entry.address})`;
            break;
          case 'data':
            detail = `${entry.imei}: ${entry.numberOfRecords} record(uri), Codec 0x${(entry.codecId || 0).toString(16).toUpperCase()}`;
            break;
          case 'disconnect':
            detail = `Deconectat: ${entry.imei || entry.address}`;
            break;
          case 'error':
            detail = `${entry.imei}: ${entry.error}`;
            break;
        }

        const realIdx = logEntries.indexOf(entry);
        return `<div class="log-entry ${selectedEntry === realIdx ? 'selected' : ''}" onclick="selectEntry(${realIdx})">
          <span class="log-time">${time}</span>
          <span class="log-event ${eventClass}">[${entry.event.toUpperCase()}]</span>
          <span class="log-detail">${detail}</span>
        </div>`;
      }).join('');

      document.getElementById('log-status').textContent = `${filtered.length} intrari`;
      document.getElementById('log-count').textContent = logEntries.length;

      // Auto-scroll
      if (!isPaused) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function selectEntry(idx) {
      selectedEntry = idx;
      const entry = logEntries[idx];

      if (entry.event === 'data' && entry.records && entry.records.length > 0) {
        // Afisare detaliata pentru intrari DATA
        let html = `<div style="color:#38bdf8;font-weight:bold;margin-bottom:12px;">📡 ${entry.imei} — ${entry.numberOfRecords} record(uri), Codec 0x${(entry.codecId||0).toString(16).toUpperCase()}</div>`;

        entry.records.forEach((rec, i) => {
          const ts = new Date(rec.timestamp).toLocaleString('ro-RO');
          const gps = rec.gps || {};
          const io = rec.io || {};

          html += `<div style="border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:12px;background:#0f172a;">`;
          html += `<div style="color:#f97316;font-weight:bold;margin-bottom:8px;">Record ${i+1} — ${ts}</div>`;

          // GPS Section
          html += `<div style="margin-bottom:8px;">`;
          html += `<div style="color:#22c55e;font-weight:bold;margin-bottom:4px;">📍 GPS</div>`;
          html += `<table style="width:100%;font-size:11px;">`;
          html += `<tr><td style="color:#64748b;width:140px;">Latitude</td><td style="color:#e2e8f0;">${gps.latitude || 0}</td>`;
          html += `<td style="color:#64748b;width:140px;">Longitude</td><td style="color:#e2e8f0;">${gps.longitude || 0}</td></tr>`;
          html += `<tr><td style="color:#64748b;">Altitude</td><td style="color:#e2e8f0;">${gps.altitude || 0} m</td>`;
          html += `<td style="color:#64748b;">Speed</td><td style="color:#e2e8f0;">${gps.speed || 0} km/h</td></tr>`;
          html += `<tr><td style="color:#64748b;">Angle</td><td style="color:#e2e8f0;">${gps.angle || 0}°</td>`;
          html += `<td style="color:#64748b;">Satellites</td><td style="color:#e2e8f0;">${gps.satellites || 0}</td></tr>`;
          html += `</table></div>`;

          // IO Section - grupat pe categorii
          const ioKeys = Object.keys(io).filter(k => k !== 'eventIoId' && k !== 'totalCount');
          if (ioKeys.length > 0) {
            // Categorii IO
            const categories = {
              '⚡ Alimentare': ['external_voltage', 'battery_voltage', 'battery_current', 'battery_level'],
              '🚗 Motor / CAN': ['ignition', 'movement', 'can_speed', 'can_rpm', 'can_coolant_temp', 'can_pedal_position', 'can_engine_hours', 'can_total_mileage'],
              '⛽ Combustibil': ['can_fuel_level', 'can_fuel_consumed', 'can_fuel_rate', 'fuel_used_gps', 'fuel_rate_gps', 'fuel_consumed'],
              '📡 Retea / GPS': ['gsm_signal', 'gnss_status', 'gnss_pdop', 'gnss_hdop', 'active_gsm_operator', 'speed_io'],
              '🔌 I/O Digital': ['digital_input_1', 'digital_input_2', 'digital_input_3', 'digital_output_1', 'digital_output_2'],
              '📊 Analog': ['analog_input_1', 'analog_input_2'],
              '📏 Distanta': ['total_odometer', 'total_mileage'],
              '⚠️ Evenimente': ['trip', 'over_speeding', 'unplug', 'crash_detection', 'idling', 'towing', 'green_driving_type', 'green_driving_value'],
              '💤 Status': ['sleep_mode', 'data_mode', 'sd_status', 'iccid', 'auto_geofence']
            };

            const usedKeys = new Set();

            for (const [catName, catKeys] of Object.entries(categories)) {
              const present = catKeys.filter(k => io[k] !== undefined);
              if (present.length === 0) continue;

              html += `<div style="margin-bottom:8px;">`;
              html += `<div style="color:#a78bfa;font-weight:bold;margin-bottom:4px;">${catName}</div>`;
              html += `<table style="width:100%;font-size:11px;">`;

              for (let j = 0; j < present.length; j += 2) {
                html += `<tr>`;
                html += `<td style="color:#64748b;width:140px;">${present[j]}</td>`;
                html += `<td style="color:#e2e8f0;">${formatIoValue(present[j], io[present[j]])}</td>`;
                usedKeys.add(present[j]);
                if (present[j+1]) {
                  html += `<td style="color:#64748b;width:140px;">${present[j+1]}</td>`;
                  html += `<td style="color:#e2e8f0;">${formatIoValue(present[j+1], io[present[j+1]])}</td>`;
                  usedKeys.add(present[j+1]);
                } else {
                  html += `<td></td><td></td>`;
                }
                html += `</tr>`;
              }
              html += `</table></div>`;
            }

            // IO necategorizate
            const uncategorized = ioKeys.filter(k => !usedKeys.has(k));
            if (uncategorized.length > 0) {
              html += `<div style="margin-bottom:8px;">`;
              html += `<div style="color:#94a3b8;font-weight:bold;margin-bottom:4px;">🔧 Alte IO</div>`;
              html += `<table style="width:100%;font-size:11px;">`;
              for (let j = 0; j < uncategorized.length; j += 2) {
                html += `<tr>`;
                html += `<td style="color:#64748b;width:140px;">${uncategorized[j]}</td>`;
                html += `<td style="color:#e2e8f0;">${io[uncategorized[j]]}</td>`;
                if (uncategorized[j+1]) {
                  html += `<td style="color:#64748b;width:140px;">${uncategorized[j+1]}</td>`;
                  html += `<td style="color:#e2e8f0;">${io[uncategorized[j+1]]}</td>`;
                }
                html += `</tr>`;
              }
              html += `</table></div>`;
            }
          }

          html += `</div>`;
        });

        // Adauga si JSON-ul brut la final
        html += `<details style="margin-top:12px;"><summary style="cursor:pointer;color:#64748b;font-size:11px;">JSON brut</summary>`;
        html += `<div style="margin-top:8px;">${syntaxHighlight(JSON.stringify(entry, null, 2))}</div></details>`;

        document.getElementById('detail-content').innerHTML = html;
      } else {
        document.getElementById('detail-content').innerHTML = syntaxHighlight(JSON.stringify(entry, null, 2));
      }
      renderLog();
    }

    function formatIoValue(key, value) {
      // Formatare speciala pentru anumite valori
      if (key === 'external_voltage') return `${(value / 1000).toFixed(2)} V (${value} mV)`;
      if (key === 'battery_voltage') return `${(value / 1000).toFixed(2)} V (${value} mV)`;
      if (key === 'battery_current') return `${value} mA`;
      if (key === 'battery_level') return `${value}%`;
      if (key === 'ignition') return value ? '<span style="color:#22c55e;">ON</span>' : '<span style="color:#ef4444;">OFF</span>';
      if (key === 'movement') return value ? '<span style="color:#22c55e;">DA</span>' : '<span style="color:#64748b;">NU</span>';
      if (key === 'can_rpm') return `${value} RPM`;
      if (key === 'can_speed') return `${value} km/h`;
      if (key === 'can_coolant_temp') return `${value}°C`;
      if (key === 'can_fuel_level') return `${value}%`;
      if (key === 'gsm_signal') return `${value}/5`;
      if (key === 'total_odometer') return `${(value / 1000).toFixed(1)} km`;
      if (key === 'total_mileage') return `${(value / 1000).toFixed(1)} km`;
      if (key === 'can_engine_hours') return `${(value / 100).toFixed(1)} h`;
      if (key === 'sleep_mode') {
        const modes = { 0: 'Activ', 1: 'GPS Sleep', 2: 'Deep Sleep', 3: 'Online Sleep', 4: 'Ultra Sleep' };
        return modes[value] || value;
      }
      return value;
    }

    function clearLog() {
      logEntries.length = 0;
      selectedEntry = null;
      document.getElementById('detail-content').textContent = 'Log cleared.';
      renderLog();
    }

    function copyDetail() {
      if (selectedEntry === null) return;
      const text = JSON.stringify(logEntries[selectedEntry], null, 2);
      navigator.clipboard.writeText(text);
    }

    // ─── Device list ───
    function updateDeviceList() {
      const list = document.getElementById('device-list');
      list.innerHTML = Array.from(knownDevices).map(imei =>
        `<button class="device-btn ${filterImei === imei ? 'active' : ''}" onclick="filterByDevice('${imei}')">${imei}</button>`
      ).join('');
    }

    function filterByDevice(imei) {
      const input = document.getElementById('filter-imei');
      if (filterImei === imei) {
        filterImei = '';
        input.value = '';
        document.getElementById('io-live-content').innerHTML = '<span style="color:#64748b;">Selecteaza un dispozitiv pentru a vedea IO live.</span>';
      } else {
        filterImei = imei;
        input.value = imei;
        renderLiveIo(imei);
      }
      renderLog();
      updateDeviceList();
      loadDeviceRaw(imei);
    }

    async function loadDeviceRaw(imei) {
      try {
        const res = await fetch(`/api/debug/raw/${imei}?limit=5`);
        const data = await res.json();
        document.getElementById('detail-content').innerHTML =
          `<div style="color:#38bdf8;margin-bottom:8px;">Ultimele 5 pozitii din DB pentru ${imei}:</div>` +
          syntaxHighlight(JSON.stringify(data, null, 2));
      } catch (err) {
        console.error(err);
      }
    }

    // ─── Stats ───
    function updateStats() {
      document.getElementById('active-count').textContent = knownDevices.size;
    }

    // Fetch connections count
    fetch('/api/connections').then(r => r.json()).then(data => {
      document.getElementById('tcp-count').textContent = Object.keys(data).length;
    }).catch(() => {});

    // ─── JSON syntax highlighting ───
    function syntaxHighlight(json) {
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'json-key' : 'json-string';
        } else if (/true|false/.test(match)) {
          cls = 'json-bool';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return `<span class="${cls}">${match}</span>`;
      });
    }

    // ─── WebSocket ───
    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);
      const bar = document.getElementById('ws-bar');

      ws.onopen = () => {
        bar.textContent = 'Conectat — debug live';
        bar.className = 'ws-ok';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'debug') {
          addLogEntry(msg.data);
        }
      };

      ws.onclose = () => {
        bar.textContent = 'Deconectat — reconectare...';
        bar.className = 'ws-err';
        setTimeout(connectWs, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // ─── Live IO tracking ───
    const liveIoData = {}; // per IMEI

    function updateLiveIo(imei, records) {
      if (!records || records.length === 0) return;

      if (!liveIoData[imei]) liveIoData[imei] = { gps: {}, io: {} };

      // Actualizeaza cu ultimul record
      const lastRec = records[records.length - 1];
      if (lastRec.gps) Object.assign(liveIoData[imei].gps, lastRec.gps);
      if (lastRec.io) Object.assign(liveIoData[imei].io, lastRec.io);
      liveIoData[imei].timestamp = lastRec.timestamp;
      liveIoData[imei].lastUpdate = new Date().toISOString();

      // Daca acest IMEI e selectat, actualizeaza panoul
      if (filterImei === imei) renderLiveIo(imei);
    }

    function renderLiveIo(imei) {
      const container = document.getElementById('io-live-content');
      const data = liveIoData[imei];
      if (!data) {
        container.innerHTML = '<span style="color:#64748b;">Nu sunt date IO pentru acest dispozitiv.</span>';
        return;
      }

      const gps = data.gps || {};
      const io = data.io || {};
      const ts = data.timestamp ? new Date(data.timestamp).toLocaleString('ro-RO') : '-';
      const lastUp = data.lastUpdate ? new Date(data.lastUpdate).toLocaleTimeString('ro-RO') : '-';

      let html = `<div style="color:#64748b;font-size:10px;margin-bottom:6px;">Ultimul update: ${lastUp} | Timestamp GPS: ${ts}</div>`;

      // GPS
      html += `<div class="io-cat-header">📍 GPS</div>`;
      html += ioRow('Latitude', gps.latitude || 0);
      html += ioRow('Longitude', gps.longitude || 0);
      html += ioRow('Altitude', `${gps.altitude || 0} m`);
      html += ioRow('Speed', `${gps.speed || 0} km/h`);
      html += ioRow('Angle', `${gps.angle || 0}°`);
      html += ioRow('Satellites', gps.satellites || 0);

      // Categorii IO
      const categories = {
        '⚡ Alimentare': ['external_voltage', 'battery_voltage', 'battery_current', 'battery_level'],
        '🚗 Motor / CAN': ['ignition', 'movement', 'can_speed', 'can_rpm', 'can_coolant_temp', 'can_pedal_position', 'can_engine_hours', 'can_total_mileage'],
        '⛽ Combustibil': ['can_fuel_level', 'can_fuel_consumed', 'can_fuel_rate', 'fuel_used_gps', 'fuel_rate_gps', 'fuel_consumed'],
        '📡 Retea': ['gsm_signal', 'gnss_status', 'gnss_pdop', 'gnss_hdop', 'active_gsm_operator', 'speed_io'],
        '🔌 I/O Digital': ['digital_input_1', 'digital_input_2', 'digital_input_3', 'digital_output_1', 'digital_output_2'],
        '📊 Analog': ['analog_input_1', 'analog_input_2'],
        '📏 Distanta': ['total_odometer', 'total_mileage'],
        '⚠️ Evenimente': ['trip', 'over_speeding', 'unplug', 'crash_detection', 'idling', 'towing', 'green_driving_type', 'green_driving_value'],
        '💤 Status': ['sleep_mode', 'data_mode', 'sd_status', 'iccid', 'auto_geofence']
      };

      const usedKeys = new Set(['eventIoId', 'totalCount']);

      for (const [catName, catKeys] of Object.entries(categories)) {
        const present = catKeys.filter(k => io[k] !== undefined);
        if (present.length === 0) continue;

        html += `<div class="io-cat-header">${catName}</div>`;
        present.forEach(k => {
          html += ioRow(k, formatIoValue(k, io[k]));
          usedKeys.add(k);
        });
      }

      // IO necategorizate
      const uncategorized = Object.keys(io).filter(k => !usedKeys.has(k));
      if (uncategorized.length > 0) {
        html += `<div class="io-cat-header">🔧 Alte IO</div>`;
        uncategorized.forEach(k => {
          html += ioRow(k, io[k]);
        });
      }

      container.innerHTML = html;
    }

    function ioRow(name, value) {
      return `<div class="io-live-row"><span class="io-live-name">${name}</span><span class="io-live-val">${value}</span></div>`;
    }

    // ─── Load existing log ───
    fetch('/api/debug/log').then(r => r.json()).then(entries => {
      entries.forEach(addLogEntry);
    }).catch(() => {});

    // ─── Start ───
    connectWs();
  </script>
</body>
</html>
