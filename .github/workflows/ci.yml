name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: CI (lint + unit + smoke server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci

      # 1) Lint — syntax check pe TOATE modulele core (catch rapid regresii de sintaxă)
      - name: Lint (syntax check)
        run: |
          node --check server.js
          node --check db.js
          node --check codec8e.js
          node --check agents.js
          node --check io_catalog.js
          node --check plans.js
          node --check reports.js
          node --check report_export.js
          node --check report_schedules.js
          node --check channels.js
          node --check ai.js
          node --check billing.js
          node --check tacho.js
          node --check geocode.js

      # 2) Unit — deterministe, fără server/rețea: parser codec, agenți, billing (HMAC webhook)
      - name: Unit tests (codec + agenți + billing)
        run: |
          node test_codec8e.js
          node test_agents.js
          node test_billing.js
          node verify_fueltheft.js
          node verify_fuel_parcare.js
          node verify_fuel_alarma.js
          node verify_tollro.js
          node verify_io_map.js
          node tools/gen-can-icons.js --check

      # 3) Smoke — server embedded (PGlite + SEED_TEST): izolare multi-tenant + RBAC
      - name: Smoke tests (server)
        run: npm test

      # 4) Securitate — fiecare suită apără o reparație care a fost cândva o gaură REALĂ.
      # Rulează în serie (fiecare pornește propriul server, pe porturi proprii) și cade la primul
      # eșec. Fără ele, poarta de dinaintea livrării ar fi verificat doar sintaxa și izolarea
      # între companii — adică nimic din ce s-a reparat aici.
      - name: Securitate (autentificare, IDOR, ingest, notificări, GDPR)
        run: |
          set -e
          node verify_push_viteza.js        # comutatorul stins chiar stinge push-ul (2 motoare, 1 preferință)
          node verify_auth_hardening.js     # politica de parole + adresa IP care nu se poate falsifica
          node verify_notif_idor.js         # notificarea altei companii nu se poate citi după id
          node verify_ack_durabil.js        # confirmarea către tracker vine DUPĂ scriere (zero poziții pierdute)
          node verify_admin_retras.js       # contul de instalare se retrage, dar nu ne închide afară
          node verify_reparatii_lansare.js  # plafon TCP, resetare parolă, cache reguli, export/ștergere GDPR
          node verify_docscan.js            # citirea actelor: PDF gratuit, propuneri, nimic salvat singur
          node verify_docparse_acte.js      # extragerea din acte, pe forme reale de așezare în pagină
          node verify_expirari.js           # alertele de expirare: prag configurabil, dedup, fără-dată vizibil
          node verify_follow.js             # „merg după el": distanța, direcția, formatarea (fără server)

      # NOTĂ test-debt: phase2-7_smoke, ws_smoke și verify_{sys,io,fms,tenant,faza2}
      # NU sunt încă în CI — au eșecuri de asserțiune pre-existente sau hardcodează portul 3000.
      # De curățat într-un pass dedicat înainte de a le adăuga ca gate (vezi AUDIT-RA-TRACKS.md, P0.4).
