name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: CI (lint + unit + smoke server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci

      # 1) Lint — syntax check pe TOATE modulele core (catch rapid regresii de sintaxă)
      - name: Lint (syntax check)
        run: |
          node verify_poarta.js
          node --check server.js
          node --check db.js
          node --check codec8e.js
          node --check agents.js
          node --check io_catalog.js
          node --check plans.js
          node --check reports.js
          node --check report_export.js
          node --check report_schedules.js
          node --check channels.js
          node --check ai.js
          node --check tacho.js
          node --check geocode.js
          # ⚠ NU adăuga aici un fișier fără să-l ai în depozit. `billing.js` a rămas scris în lista
          # asta după ce a fost ȘTERS odată cu Stripe (15.09) — și poarta a picat la PRIMUL rând,
          # în 20 de secunde, la FIECARE împingere, timp de 36 de commit-uri. Nimic din ce urmează
          # (unit, smoke, securitate) n-a mai rulat în tot acest timp. Păzit de `verify_poarta.js`.

      # 2) Unit — deterministe, fără server/rețea: parser codec, agenți, consum, taxe de drum.
      # Rulează toate și cade la final, ca la pasul 4: o probă picată nu le ascunde pe celelalte.
      - name: Unit tests (codec + agenți + consum)
        run: |
          rele=""
          s() { echo "── $* ──"; node "$@" || rele="$rele $1"; }
          s test_codec8e.js
          s test_agents.js
          s verify_fueltheft.js
          s verify_fuel_parcare.js
          s verify_fuel_alarma.js
          s verify_can_report.js
          s verify_tollro.js
          s verify_io_map.js
          s tools/gen-can-icons.js --check
          if [ -n "$rele" ]; then echo "::error::Probe unitare picate:$rele"; exit 1; fi

      # 3) Smoke — server embedded (PGlite + SEED_TEST): izolare multi-tenant + RBAC
      - name: Smoke tests (server)
        run: npm test

      # 4) Securitate — fiecare suită apără o reparație care a fost cândva o gaură REALĂ.
      # Fără ele, poarta de dinaintea livrării ar fi verificat doar sintaxa și izolarea între
      # companii — adică nimic din ce s-a reparat aici.
      #
      # ⚠ Rulează TOATE, apoi cade la final cu lista celor picate. Cu `set -e` se oprea la prima:
      # o suită învechită ascundea celelalte nouă, iar raportul spunea doar numele ei. Exact boala
      # care a ținut poarta moartă o săptămână, la scară mai mică (22.09).
      - name: Securitate (autentificare, IDOR, ingest, notificări, GDPR)
        run: |
          rele=""
          s() { echo "── $1 ──"; node "$1" || rele="$rele $1"; }
          s verify_push_viteza.js        # comutatorul stins chiar stinge push-ul (2 motoare, 1 preferință)
          s verify_auth_hardening.js     # politica de parole + adresa IP care nu se poate falsifica
          s verify_acces_revocat.js      # cont dezactivat/șters/expirat: sesiunea și harta live se închid pe loc
          s verify_paritate_telefon.js   # telefonul (și cel vechi): zone și roluri neșterse, fondul RA Insight respectat, tokenii ascunși
          s verify_restaurare.js         # backup → restaurare pe bază goală: legături, facturi, criptat/necriptat, --wipe
          s verify_notif_idor.js         # notificarea altei companii nu se poate citi după id
          s verify_ack_durabil.js        # confirmarea către tracker vine DUPĂ scriere (zero poziții pierdute)
          s verify_admin_retras.js       # contul de instalare se retrage, dar nu ne închide afară
          s verify_reparatii_lansare.js  # plafon TCP, resetare parolă, cache reguli, export/ștergere GDPR
          s verify_docscan.js            # citirea actelor: PDF gratuit, propuneri, nimic salvat singur
          s verify_docparse_acte.js      # extragerea din acte, pe forme reale de așezare în pagină
          s verify_expirari.js           # alertele de expirare: prag configurabil, dedup, fără-dată vizibil
          s verify_follow.js             # „merg după el": distanța, direcția, formatarea (fără server)
          if [ -n "$rele" ]; then echo "::error::Suite de securitate picate:$rele"; exit 1; fi
          echo "Toate suitele de securitate trec ✓"

      # NOTĂ test-debt: phase2-7_smoke, ws_smoke și verify_{sys,io,fms,tenant,faza2}
      # NU sunt încă în CI — au eșecuri de asserțiune pre-existente sau hardcodează portul 3000.
      # De curățat într-un pass dedicat înainte de a le adăuga ca gate (vezi AUDIT-RA-TRACKS.md, P0.4).
