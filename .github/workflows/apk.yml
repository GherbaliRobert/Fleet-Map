name: APK de test (Android)

# Pornit MANUAL, din fila Actions. Nu rulează la fiecare push: un build Android durează câteva
# minute și n-are rost la o modificare de server.
#
# Ce produce: un APK de DEBUG, pentru încercat pe telefonul propriu. NU e de dat clienților —
# vezi mobile/android/app/build.gradle: un build de debug are `debuggable=true`, adică datele
# aplicației (inclusiv tokenul de autentificare) se pot citi de pe telefon cu `adb`. APK-ul de
# livrare are nevoie de cheia de semnătură, care încă nu e creată (e pe lista de dinainte de lansare).
on:
  workflow_dispatch:
    inputs:
      ramura:
        description: 'Ramura din care se construiește'
        required: false
        default: 'main'
      publica:
        # 21.10 (Robert: „dă-mi direct APK-ul, nu-l pot descărca din git"): un artifact se descarcă doar logat în GitHub
        # și vine arhivat. Bifat, APK-ul se pune și ca pre-release „apk-test-<versiune>", cu link direct spre fișierul .apk.
        description: 'Pune APK-ul și ca pre-release (link direct spre .apk, fără cont GitHub)'
        type: boolean
        required: false
        default: false

jobs:
  apk:
    name: Construiește APK de test
    runs-on: ubuntu-latest
    # Scrierea e folosită doar de pasul „pre-release" (bifa `publica`); restul jobului doar citește.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramura }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalează dependențele aplicației de telefon
        working-directory: mobile
        run: npm ci

      - name: Verifică tipurile
        working-directory: mobile
        run: npx tsc --noEmit

      # Notificările push cer cheia Firebase (google-services.json), care NU e în git. Din 13.10 build-ul le pornește
      # implicit (vite.config.ts), iar fără cheie `PushNotifications.register()` închide aplicația imediat după
      # intrarea în cont (21.10, APK 1.0.20 de aici: „iese din aplicație"). Deci: cu secretul GOOGLE_SERVICES_JSON
      # (conținutul fișierului) — push pornit și cheia pusă la loc; fără el — push OPRIT, aplicația merge.
      - name: Notificările push (doar cu cheia Firebase din secrete)
        id: push
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "da=1" >> "$GITHUB_OUTPUT"; else echo "da=0" >> "$GITHUB_OUTPUT"; fi

      - name: Construiește partea web (dist/)
        working-directory: mobile
        env:
          VITE_ENABLE_PUSH: ${{ steps.push.outputs.da }}
        run: npx vite build

      # Proiectul nativ Android NU e în git (vezi mobile/.gitignore) — se regenerează. Excepțiile
      # urmărite (configurația de build, manifestul, tema) trebuie PUSE LA LOC după regenerare:
      # `cap add android` scrie peste ele cu șabloanele lui, iar cu ele s-ar pierde versiunea
      # aplicației, semnătura de release și ecranul complet.
      - name: Regenerează proiectul Android, păstrând fișierele noastre
        working-directory: mobile
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          mkdir -p /tmp/alenoastre
          cp -a android/. /tmp/alenoastre/
          rm -rf android
          npx cap add android
          # Iconița și ecranul de pornire ale casei, din mobile/assets (ca pe calculator, README → „Icoane + splash").
          # Fără pasul ăsta APK-ul primea iconița standard Capacitor (un X albastru) — 21.10: „a dispărut iconița".
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B0E11' --splashBackgroundColor '#0B0E11'
          cp -a /tmp/alenoastre/variables.gradle android/variables.gradle
          cp -a /tmp/alenoastre/app/build.gradle android/app/build.gradle
          cp -a /tmp/alenoastre/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -a /tmp/alenoastre/app/src/main/res/. android/app/src/main/res/
          if [ "${{ steps.push.outputs.da }}" = "1" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx cap sync android

      - name: Construiește APK-ul
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Cum se cheamă versiunea
        id: v
        working-directory: mobile
        run: echo "nume=ratracks-test-$(grep -oP "appVersionName = '\K[^']+" android/variables.gradle)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.nume }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pune APK-ul ca pre-release (link direct)
        if: ${{ inputs.publica }}
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          V=$(grep -oP "appVersionName = '\K[^']+" android/variables.gradle)
          TAG="apk-test-$V"
          F="/tmp/RA-Track-$V-test.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$F"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$F" --clobber
          else
            gh release create "$TAG" "$F" --prerelease --target "$GITHUB_SHA" --title "APK de test $V" \
              --notes "APK de DEBUG, pentru încercat pe telefonul propriu — nu se dă clienților. Fără notificări push; semnat altfel decât APK-ul construit pe calculator, deci telefonul cere dezinstalarea celui vechi."
          fi
          echo "Link direct: https://github.com/$GH_REPO/releases/download/$TAG/RA-Track-$V-test.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Ce trebuie știut despre APK-ul ăsta
        run: |
          {
            echo "### APK de test — RA Track"
            echo ""
            echo "Se descarcă de mai jos, de la **Artifacts**. Se dezarhivează și se copiază pe telefon."
            echo ""
            echo "**De reținut:**"
            echo "- E build de **debug**, pentru încercat pe telefonul propriu. Nu se dă clienților."
            if [ "${{ steps.push.outputs.da }}" = "1" ]; then
              echo "- Are notificări push (cheia Firebase din secretul \`GOOGLE_SERVICES_JSON\`)."
            else
              echo "- **Nu are notificări push** (oprite dinadins, altfel aplicația s-ar închide): \`google-services.json\` nu e în git."
              echo "  Cu notificări: Settings → Secrets → Actions → secretul \`GOOGLE_SERVICES_JSON\` = conținutul fișierului."
            fi
            echo "- Are același nume de pachet ca aplicația reală (\`ro.ratracks.app\`), dar altă"
            echo "  semnătură — dacă ai deja RA Track pe telefon, Android cere să o **dezinstalezi**"
            echo "  întâi. Datele din aplicație se pierd (nu și cele de pe server)."
            echo "- Telefonul va cere permisiunea de a instala din afara magazinului."
          } >> "$GITHUB_STEP_SUMMARY"
